<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" width="460" height="128" role="img" aria-label="Atarjea Redes">
  <title>Atarjea Redes</title>

  <g>
    <!-- Pared del conducto -->
    <circle cx="64" cy="64" r="55" fill="none" stroke="#12455C" stroke-width="9"/>
    <!-- Camisa interior -->
    <circle cx="64" cy="64" r="39" fill="none" stroke="#C9AE8C" stroke-width="3"/>
    <!-- Monograma A -->
    <path d="M50 84 L64 43 L78 84" fill="none" stroke="#12455C" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Línea de flujo -->
    <path d="M55 71 H73" fill="none" stroke="#C9AE8C" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, 'IBM Plex Sans', Manrope, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="152" y="62" fill="#12455C" font-size="42" font-weight="700" letter-spacing="1.5">ATARJEA</text>
    <text x="154" y="94" fill="#8A7A66" font-size="19" font-weight="600" letter-spacing="9.5">REDES</text>
  </g>
</svg>
